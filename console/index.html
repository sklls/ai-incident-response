<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Incident Console</title>
<style>
  :root{
    --bg:#f6f7f9; --panel:#ffffff; --ink:#1a2230; --muted:#5b6676; --line:#e2e6ec;
    --accent:#2563eb; --s1:#dc2626; --s2:#ea580c; --s3:#d97706; --s4:#65a30d;
    --ok:#16a34a; --broken:#dc2626; --human:#f0f7ff; --agent:#fafafa;
  }
  :root:not([data-theme="light"]){ @media (prefers-color-scheme: dark){
    :root{ --bg:#0e1420; --panel:#151c2b; --ink:#e7ecf3; --muted:#9aa6b6; --line:#263146;
      --human:#122033; --agent:#141a26; }
  }}
  :root[data-theme="dark"]{ --bg:#0e1420; --panel:#151c2b; --ink:#e7ecf3; --muted:#9aa6b6;
    --line:#263146; --human:#122033; --agent:#141a26; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,Segoe UI,Roboto,sans-serif}
  header{display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
  header h1{font-size:15px;margin:0;letter-spacing:.02em}
  .approver{display:flex;align-items:center;gap:6px;color:var(--muted)}
  .approver input{font:inherit;border:1px solid var(--line);background:var(--bg);color:var(--ink);
    border-radius:6px;padding:3px 8px;width:120px}
  .chain{font-weight:600;padding:2px 8px;border-radius:999px;font-size:12px}
  .chain.ok{color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,transparent)}
  .chain.broken{color:var(--broken);background:color-mix(in srgb,var(--broken) 16%,transparent)}
  main{display:grid;grid-template-columns:260px 1fr 300px;gap:0;min-height:0}
  .col{padding:14px 16px;border-right:1px solid var(--line);overflow:auto}
  .col:last-child{border-right:0}
  h3.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 10px}
  .qrow{display:grid;grid-template-columns:auto 1fr;gap:4px 8px;width:100%;text-align:left;
    background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-bottom:8px;
    color:var(--ink);cursor:pointer;align-items:center}
  .qrow:hover{border-color:var(--accent)}
  .qrow.sel{outline:2px solid var(--accent)}
  .qrow .sev{grid-row:1/3;font-weight:700;border-radius:6px;padding:2px 7px;color:#fff;font-size:12px}
  .qid{font-weight:600}.qtitle{font-size:12px;color:var(--muted)}.qscn{font-size:11px;color:var(--muted);text-transform:uppercase}
  .sev-S1{background:var(--s1)} .sev-S2{background:var(--s2)} .sev-S3{background:var(--s3)} .sev-S4{background:var(--s4)}
  b.sev-S1{color:var(--s1);background:none} b.sev-S2{color:var(--s2);background:none}
  b.sev-S3{color:var(--s3);background:none} b.sev-S4{color:var(--s4);background:none}
  .stepper{display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin:10px 0}
  .step{font-size:11px;padding:3px 8px;border-radius:999px;background:var(--bg);border:1px solid var(--line);color:var(--muted)}
  .step.active{background:var(--accent);color:#fff;border-color:var(--accent)}
  .stepper i{color:var(--muted);font-style:normal}
  .meta,.rootcause,.obl{margin:8px 0}
  .obl ul{margin:4px 0 0;padding-left:18px}
  .countdown{color:var(--s1);font-weight:600}
  .approval{background:var(--panel);border:1px solid var(--s1);border-radius:10px;padding:12px}
  .atag{color:var(--s1);font-weight:700;font-size:12px;margin-bottom:6px}
  .approval textarea{width:100%;min-height:52px;margin:8px 0;border:1px solid var(--line);border-radius:6px;
    background:var(--bg);color:var(--ink);font:inherit;padding:6px}
  .abtns{display:flex;gap:8px}
  .abtns button{flex:1;border:0;border-radius:7px;padding:8px;font-weight:700;cursor:pointer;color:#fff}
  #approve{background:var(--ok)} #reject{background:var(--broken)}
  .empty{color:var(--muted);font-style:italic}
  .drawer{grid-column:1/-1;border-top:1px solid var(--line);background:var(--panel);padding:12px 16px;max-height:34vh;overflow:auto}
  .drawer .head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .ledger table{width:100%;border-collapse:collapse;font-size:12px}
  .ledger th,.ledger td{text-align:left;padding:4px 8px;border-bottom:1px solid var(--line);vertical-align:top}
  .ledger tr.actor-human{background:var(--human)} .ledger tr.actor-agent{background:var(--agent)}
  .note{color:var(--muted);font-size:12px}
  @media (max-width:820px){ main{grid-template-columns:1fr} .col{border-right:0;border-bottom:1px solid var(--line)} }
</style>
</head>
<body>
<header>
  <h1>⬡ AI INCIDENT RESPONSE CONSOLE</h1>
  <div class="approver">Approver:
    <input id="approver" value="R. Mehta" aria-label="approver name">
    <span id="badge" class="chain ok">⛓ verified</span>
  </div>
</header>
<main>
  <section class="col" id="queueCol"><h3 class="lbl">Incidents</h3><div id="queue"><p class="empty">Connecting…</p></div></section>
  <section class="col" id="detailCol"><h3 class="lbl">Incident</h3><div id="detail"><p class="empty">Select an incident</p></div></section>
  <section class="col" id="approvalCol"><h3 class="lbl">Human approval</h3><div id="approval"><p class="empty">No pending approvals</p></div></section>
  <section class="drawer">
    <div class="head"><h3 class="lbl" style="margin:0">Audit ledger — append-only, tamper-evident</h3></div>
    <div id="ledger"><p class="empty">—</p></div>
    <p class="note" id="status"></p>
  </section>
</main>

<script type="module">
import { renderQueue, renderLedger, renderApprovalCard, renderIncidentDetail } from './console/render.mjs';
import { makeAdapter } from './console/db-adapter.mjs';
import { sealEntry } from './lib/ledger.mjs';

const $ = (id) => document.getElementById(id);
const setStatus = (t) => { $('status').textContent = t; };
let adapter = null, selectedId = null, curLedger = [], curApprovals = [], unsubLedger = null, unsubApprovals = null;

// per-viewer convenience: remember approver name
try { const a = localStorage.getItem('approver'); if (a) $('approver').value = a; } catch {}
$('approver').addEventListener('change', () => { try { localStorage.setItem('approver', $('approver').value); } catch {} });

function paintLedger() {
  $('ledger').innerHTML = renderLedger(curLedger);
  // mirror the chain badge into the header
  const badge = $('ledger').querySelector('.chain');
  if (badge) { $('badge').className = badge.className; $('badge').textContent = badge.textContent; }
}

function paintApproval() {
  const pending = curApprovals.find(a => a.status === 'pending') || null;
  $('approval').innerHTML = renderApprovalCard(pending);
  const ap = $('approval').querySelector('#approve');
  const rj = $('approval').querySelector('#reject');
  if (ap) ap.onclick = () => decide(pending, 'approved');
  if (rj) rj.onclick = () => decide(pending, 'rejected');
}

async function decide(pending, status) {
  if (!pending || !adapter) return;
  const approver = $('approver').value.trim() || 'approver';
  const rationale = ($('approval').querySelector('#rationale')?.value || '').trim();
  const nextSeq = (curLedger.reduce((m, e) => Math.max(m, e.seq), 0)) + 1;
  const head = curLedger.length ? curLedger[curLedger.length - 1].hash : 'GENESIS';
  const verb = status === 'approved' ? 'approved' : 'rejected';
  const entry = sealEntry(head, nextSeq, {
    incident_id: pending.incident_id, ts: new Date().toISOString(),
    actor_type: 'human', actor: approver, phase: pending.phase,
    action: `${verb} ${pending.proposed_action}`, rationale,
  });
  try {
    await adapter.setApproval(pending.id, { status, decided_by: approver,
      decided_at: new Date().toISOString(), rationale });
    await adapter.appendLedger(entry);
    setStatus(`Recorded: ${verb} "${pending.proposed_action}" by ${approver}.`);
  } catch (e) { setStatus(`Could not record decision (${e?.code || 'error'}).`); }
}

function selectIncident(incidents, id) {
  selectedId = id;
  const inc = incidents.find(i => i.id === id);
  document.querySelectorAll('.qrow').forEach(b => b.classList.toggle('sel', b.dataset.id === id));
  $('detail').innerHTML = renderIncidentDetail(inc, curLedger);
  startCountdown(inc);
  if (unsubLedger) unsubLedger(); if (unsubApprovals) unsubApprovals();
  curLedger = []; curApprovals = []; paintLedger(); paintApproval();
  unsubLedger = adapter.onLedger(id, l => { curLedger = l; paintLedger();
    if (incidents.find(i => i.id === selectedId)) $('detail').innerHTML = renderIncidentDetail(incidents.find(i=>i.id===selectedId), curLedger); },
    e => setStatus(`ledger stream: ${e.code}`));
  unsubApprovals = adapter.onApprovals(id, a => { curApprovals = a; paintApproval(); },
    e => setStatus(`approvals stream: ${e.code}`));
}

let countdownTimer = null;
function startCountdown(inc) {
  if (countdownTimer) clearInterval(countdownTimer);
  const ob = (inc?.obligations || []).find(o => o.deadline);
  if (!ob) return;
  const tick = () => {
    const ms = new Date(ob.deadline).getTime() - Date.now();
    const el = $('detail').querySelector('.countdown');
    if (!el) return;
    if (ms <= 0) { el.textContent = 'DEADLINE PASSED'; return; }
    const h = Math.floor(ms / 3.6e6), m = Math.floor(ms % 3.6e6 / 6e4), s = Math.floor(ms % 6e4 / 1e3);
    el.textContent = `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')} to deadline`;
  };
  tick(); countdownTimer = setInterval(tick, 1000);
}

(async function init() {
  const db = await claude.use('db');
  if (!db) { $('queue').innerHTML = '<p class="empty">Database unavailable in this view.</p>'; return; }
  adapter = makeAdapter(db);
  adapter.onIncidents(incidents => {
    $('queue').innerHTML = renderQueue(incidents);
    document.querySelectorAll('.qrow').forEach(b => b.onclick = () => selectIncident(incidents, b.dataset.id));
    if (!selectedId && incidents.length) selectIncident(incidents, incidents[0].id);
    else if (selectedId) selectIncident(incidents, selectedId);
  }, e => setStatus(`incidents stream: ${e.code}`));
  setStatus('Connected. Seed the database to begin.');
})();
</script>
</body>
</html>
